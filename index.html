<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B8470F">
<title>WoofMap</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#1F2A24;--muted:#56625B;--brand:#B8470F;--soft:#FFE9D6;--line:#8A9A90;--bg:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans Georgian','Segoe UI',system-ui,sans-serif;color:var(--ink);background:#EDEFEA}
#app{max-width:480px;height:100dvh;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
.view{height:100%;display:flex;flex-direction:column}
.hidden{display:none!important}
.demo{background:#1F2A24;color:#fff;font-size:12px;padding:6px 12px;text-align:center}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px}
h1{margin:0;font-size:36px;text-align:center}
.sub{margin:0 0 12px;text-align:center;color:var(--muted)}
label{font-size:14px;font-weight:600}
input[type=email],input[type=text],input[type=number],input[type=password]{height:52px;padding:0 14px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:16px;width:100%}
button{font:inherit;cursor:pointer}
.primary{height:56px;border:0;border-radius:28px;background:var(--brand);color:#fff;font-size:16px;font-weight:700;width:100%}
.primary:disabled{opacity:.6}
.primary.stop{background:#3B4640}
.link{background:none;border:0;color:var(--brand);font-weight:600;padding:8px}
.logo{width:72px;height:72px;border-radius:50%;background:var(--brand);align-self:center}
.avatar{width:140px;height:140px;border-radius:50%;background:#E4E9E4 center/cover;align-self:center;border:0;font-size:48px;color:var(--muted)}
header{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 20px;background:var(--soft);font-size:20px;font-weight:700}
header .link{font-size:14px}
#map{flex:1;min-height:0}
.bar{position:absolute;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));display:flex;gap:12px;z-index:1000}
.sos{width:56px;height:56px;flex:none;border:0;border-radius:50%;background:#B3261E;color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.bar .primary{box-shadow:0 2px 8px rgba(0,0,0,.3)}
.pin{width:48px;height:48px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);background:#3D5A99 center/cover;color:#fff;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
.pin.mine{border-color:#2563EB}
.pin.mine.walking{border-color:#15803D;box-shadow:0 0 0 4px rgba(21,128,61,.35),0 2px 6px rgba(0,0,0,.4)}
.me{width:22px;height:22px;border-radius:50%;background:#2563EB;border:3px solid #fff;box-shadow:0 0 0 2px rgba(37,99,235,.3)}
.me.walking{background:#15803D;box-shadow:0 0 0 2px rgba(21,128,61,.3)}
.locate{position:absolute;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:1000;width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#1F2A24;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:3000;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
button:focus-visible,input:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
</style>
</head>
<body>
<div id="app">

  <section id="login" class="view hidden">
    <div id="demoBanner" class="demo hidden">დემო რეჟიმი: Supabase ჯერ არ არის მიერთებული. პაროლი: ნებისმიერი (6+ სიმბოლო)</div>
    <div class="center">
      <div class="logo"></div>
      <h1>WoofMap</h1>
      <p class="sub">იპოვე მეზობელი ცუგოები</p>
      <label for="email">ელფოსტა</label>
      <input id="email" type="email" placeholder="name@example.com" autocomplete="email">
      <label for="password">პაროლი</label>
      <input id="password" type="password" minlength="6" placeholder="მინიმუმ 6 სიმბოლო" autocomplete="current-password">
      <button id="loginBtn" class="primary">შესვლა</button>
      <button id="switchMode" class="link">ახალი ხარ? რეგისტრაცია</button>
    </div>
  </section>

  <section id="dog" class="view hidden">
    <header><span>შენი ცუგო</span><button id="logout1" class="link">გასვლა</button></header>
    <div class="center">
      <button id="avatar" class="avatar" aria-label="ფოტოს არჩევა">+</button>
      <input id="photo" type="file" accept="image/*" class="hidden">
      <p class="sub">დააჭირე ფოტოს ასარჩევად</p>
      <label for="dogName">ძაღლის სახელი</label>
      <input id="dogName" type="text" placeholder="მაგ. ლუნა" maxlength="30">
      <button id="saveDog" class="primary">შენახვა</button>
    </div>
  </section>

  <section id="mapView" class="view hidden">
    <header><span id="dogTitle"></span><button id="logout2" class="link">გასვლა</button></header>
    <div id="map"></div>
    <button id="locate" class="locate" aria-label="ჩემი ადგილმდებარეობა"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F2A24" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <div class="bar">
      <button id="walkBtn" class="primary">ვსეირნობ</button>
      <button id="sos" class="sos" aria-label="SOS">SOS</button>
    </div>
  </section>

</div>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
/* ====== კონფიგურაცია: Supabase → Project Settings → API ====== */
const SUPABASE_URL = 'https://oyqcbyygxcpilunvtuwh.supabase.co';   // მაგ. https://abcd1234.supabase.co
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95cWNieXlneGNwaWx1bnZ0dXdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MjU5NzMsImV4cCI6MjEwOTEwMTk3M30.HZTiWZchCfMLmLRuF5g6yp9oGOtc6xX_P_I03eg2qBQ';   // anon public key
/* თუ ორივე ცარიელია, აპი დემო რეჟიმში გაიხსნება */

const DEMO = !SUPABASE_URL || !SUPABASE_KEY;
const FALLBACK = { lat: 41.7151, lng: 44.8271 }; // თბილისი
const $ = id => document.getElementById(id);

/* ---------- დამხმარე ---------- */
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 3000);
}
function show(id) {
  ['login', 'dog', 'mapView'].forEach(v => $(v).classList.toggle('hidden', v !== id));
}
function distM(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLa = r(b.lat - a.lat), dLn = r(b.lng - a.lng);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLn / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function compress(file) { // მაქს. 800px, JPEG 75% (~200-300 KB)
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 800 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(new Error('ფოტო ვერ დამუშავდა')); }, 'image/jpeg', 0.75);
    };
    img.onerror = () => rej(new Error('ფოტო ვერ გაიხსნა'));
    img.src = url;
  });
}
function toDataUrl(blob) {
  return new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(blob); });
}

/* ---------- API: Supabase ---------- */
let sb = null;
const real = {
  async user() { const { data } = await sb.auth.getSession(); return data.session ? data.session.user : null; },
  onAuth(cb) { sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') cb(); }); },
  async signIn(email, pw) { const { error } = await sb.auth.signInWithPassword({ email, password: pw }); if (error) throw error; },
  async signUp(email, pw) {
    const { data, error } = await sb.auth.signUp({ email, password: pw });
    if (error) throw error;
    if (!data.session) throw new Error('ანგარიში შეიქმნა, მაგრამ Supabase მეილის დადასტურებას ითხოვს. გამორთეთ "Confirm email" (Authentication → Sign In / Providers → Email)');
  },
  async signOut() { await sb.auth.signOut(); },
  async getDog(uid) {
    const { data, error } = await sb.from('dogs').select('*').eq('owner_id', uid).limit(1);
    if (error) throw error; return data[0] || null;
  },
  async createDog(uid, name, blob) {
    const path = uid + '/' + Date.now() + '.jpg';
    let r = await sb.storage.from('dog-photos').upload(path, blob, { contentType: 'image/jpeg' });
    if (r.error) throw r.error;
    r = await sb.from('dogs').insert({ owner_id: uid, name, photo_path: path });
    if (r.error) throw r.error;
  },
  photoUrl(d) { return d.photo_path ? sb.storage.from('dog-photos').getPublicUrl(d.photo_path).data.publicUrl : ''; },
  async upsertWalk(dogId, lat, lng) {
    const { error } = await sb.rpc('upsert_walk', { p_dog_id: dogId, p_lat: lat, p_lng: lng });
    if (error) throw error;
  },
  async stopWalk(dogId) { await sb.from('walks').update({ is_active: false }).eq('dog_id', dogId); },
  async nearby(lat, lng) {
    const { data, error } = await sb.rpc('nearby_walks', { p_lat: lat, p_lng: lng, radius_m: 2000 });
    if (error) throw error; return data || [];
  }
};

/* ---------- API: დემო (ბრაუზერის მეხსიერებაში) ---------- */
const demoStore = {
  get() { try { return JSON.parse(localStorage.getItem('woofmap_demo') || '{}'); } catch (e) { return {}; } },
  set(v) { try { localStorage.setItem('woofmap_demo', JSON.stringify(v)); } catch (e) { /* სივრცე გავსებულია */ } }
};
const demoListeners = [];
const demo = {
  async user() { const s = demoStore.get(); return s.email ? { id: 'demo', email: s.email } : null; },
  onAuth(cb) { demoListeners.push(cb); },
  async signIn(email) { demoStore.set({ ...demoStore.get(), email }); demoListeners.forEach(f => f()); },
  async signUp(email) { return demo.signIn(email); },
  async signOut() { const s = demoStore.get(); delete s.email; demoStore.set(s); demoListeners.forEach(f => f()); },
  async getDog() { return demoStore.get().dog || null; },
  async createDog(uid, name, blob) {
    demoStore.set({ ...demoStore.get(), dog: { id: 'demo-dog', name, photo_url: await toDataUrl(blob) } });
  },
  photoUrl(d) { return d.photo_url || ''; },
  async upsertWalk() { },
  async stopWalk() { },
  async nearby(lat, lng) {
    const base = [['რექსი', .0022, .0012], ['ბელა', -.0016, .0021], ['მაქსი', .0011, -.0026]];
    const t = Date.now() / 25000;
    return base.map((b, i) => {
      const p = { lat: lat + b[1] + Math.sin(t + i) * .0003, lng: lng + b[2] + Math.cos(t + i) * .0003 };
      return { dog_id: 'd' + i, name: b[0], photo_path: '', lat: p.lat, lng: p.lng, dist_m: distM({ lat, lng }, p) };
    });
  }
};

if (!DEMO) sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const A = DEMO ? demo : real;

/* ---------- მდგომარეობა ---------- */
let user = null, dog = null, me = null, walking = false;
let map = null, layer = null, pollTimer = null, watchId = null, wakeLock = null;
let lastSent = { at: 0, pos: null }, pendingBlob = null, mapStarted = false;

/* ---------- რეგისტრაცია / შესვლა ---------- */
let signUpMode = false;
function setMode(up) {
  signUpMode = up;
  $('loginBtn').textContent = up ? 'რეგისტრაცია' : 'შესვლა';
  $('switchMode').textContent = up ? 'უკვე გაქვს ანგარიში? შესვლა' : 'ახალი ხარ? რეგისტრაცია';
  $('password').autocomplete = up ? 'new-password' : 'current-password';
}
function authError(e) {
  const m = (e && e.message) || '';
  if (/Invalid login/i.test(m)) return 'არასწორი ელფოსტა ან პაროლი';
  if (/already registered/i.test(m)) return 'ეს ელფოსტა უკვე რეგისტრირებულია. გადადით შესვლაზე';
  if (/rate limit/i.test(m)) return 'ძალიან ბევრი მცდელობა. სცადეთ ცოტა ხანში';
  return m || 'შეცდომა';
}
$('loginBtn').onclick = async () => {
  const email = $('email').value.trim(), pw = $('password').value, btn = $('loginBtn');
  if (!email.includes('@')) return toast('ჩაწერეთ სწორი ელფოსტა');
  if (pw.length < 6) return toast('პაროლი მინიმუმ 6 სიმბოლო უნდა იყოს');
  btn.disabled = true;
  try { await (signUpMode ? A.signUp(email, pw) : A.signIn(email, pw)); }
  catch (e) { toast(authError(e)); }
  btn.disabled = false;
};
$('switchMode').onclick = () => setMode(!signUpMode);
const logout = async () => { await stopWalking(); await A.signOut(); };
$('logout1').onclick = logout; $('logout2').onclick = logout;

/* ---------- ძაღლის პროფილი ---------- */
$('avatar').onclick = () => $('photo').click();
$('photo').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    pendingBlob = await compress(f);
    $('avatar').style.backgroundImage = 'url("' + URL.createObjectURL(pendingBlob) + '")';
    $('avatar').textContent = '';
  } catch (err) { toast(err.message); }
};
$('saveDog').onclick = async () => {
  const name = $('dogName').value.trim(), btn = $('saveDog');
  if (!name || !pendingBlob) return toast('ჩაწერეთ სახელი და აირჩიეთ ფოტო');
  btn.disabled = true;
  try { await A.createDog(user.id, name, pendingBlob); await route(); }
  catch (e) { toast('შეცდომა: ' + (e.message || e)); }
  btn.disabled = false;
};

/* ---------- რუკა ---------- */
function pinEl(d) {
  const el = document.createElement('div'); el.className = 'pin';
  const url = A.photoUrl(d);
  if (url) el.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")';
  else el.textContent = (d.name || '?').charAt(0);
  return el;
}
function drawMe() {
  if (!layer || !me) return;
  if (drawMe.m) layer.removeLayer(drawMe.m);
  if (drawMe.c) layer.removeLayer(drawMe.c);
  drawMe.m = drawMe.c = null;
  if (!walking) return;  // სეირნობის გარეშე ჩემი ძაღლი რუკაზე არ ჩანს
  if (me.acc && me.acc < 2000)
    drawMe.c = L.circle([me.lat, me.lng], { radius: me.acc, weight: 1, color: '#2563EB', fillOpacity: 0.1, interactive: false }).addTo(layer);
  const el = pinEl(dog);  // ჩემი ძაღლის ფოტო წერტილის ნაცვლად
  el.classList.add('mine'); if (walking) el.classList.add('walking');
  drawMe.m = L.marker([me.lat, me.lng], { icon: L.divIcon({ className: '', html: el, iconSize: [48, 48], iconAnchor: [24, 24] }), zIndexOffset: 1000 }).addTo(layer);
}
async function loadNearby() {
  if (!me) return;
  try {
    const list = (await A.nearby(me.lat, me.lng)).filter(d => d.dog_id !== dog.id);
    if (drawNearby.group) layer.removeLayer(drawNearby.group);
    drawNearby.group = L.layerGroup().addTo(layer);
    list.forEach(d => {
      const pop = document.createElement('div');
      const b = document.createElement('b'); b.textContent = d.name;
      pop.append(b, document.createElement('br'), '~' + (Math.round(d.dist_m / 50) * 50) + ' მ-ში სეირნობს');
      L.marker([d.lat, d.lng], { icon: L.divIcon({ className: '', html: pinEl(d), iconSize: [48, 48], iconAnchor: [24, 24] }) })
        .bindPopup(pop).addTo(drawNearby.group);
    });
  } catch (e) { console.warn('nearby:', e); }
}
function drawNearby() { }
function getPos() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      () => res(null), { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
}
async function startMap() {
  if (mapStarted) return; mapStarted = true;
  if (!map) {
    map = L.map('map', { zoomControl: false }).setView([FALLBACK.lat, FALLBACK.lng], 15);
    const OSM = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
    const CARTO = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
    // OSM-ის სერვერი ბლოკავს გვერდებს, რომლებიც Referer-ს არ აგზავნიან (მაგ. კომპიუტერზე file:// ფაილი)
    let useCarto = location.protocol === 'file:';
    const base = L.tileLayer(useCarto ? CARTO : OSM, { maxZoom: 19, subdomains: 'abcd', attribution: '© OpenStreetMap contributors © CARTO' }).addTo(map);
    let tileErrors = 0;
    base.on('tileerror', () => { if (!useCarto && ++tileErrors === 4) { useCarto = true; base.setUrl(CARTO); } });
    layer = L.layerGroup().addTo(map);
  }
  setTimeout(() => map.invalidateSize(), 50);
  const p = await getPos();
  if (!p) toast('GPS ვერ ვიპოვე. ნაჩვენებია თბილისის ცენტრი');
  me = p || FALLBACK; map.setView([me.lat, me.lng], 16);
  if (p && p.acc > 150) toast('GPS სიზუსტე დაბალია (~' + Math.round(p.acc) + ' მ). გადით ღია ცის ქვეშ');
  drawMe(); await loadNearby();
  pollTimer = setInterval(loadNearby, 10000);
}

/* ---------- სეირნობა ---------- */
async function sendPos(p) {
  const now = Date.now();
  const moved = lastSent.pos ? distM(lastSent.pos, p) : Infinity;
  if (moved < 25 && now - lastSent.at < 30000) return; // ბატარეისა და მოთხოვნების დასაზოგად
  lastSent = { at: now, pos: p };
  try { await A.upsertWalk(dog.id, p.lat, p.lng); } catch (e) { console.warn('walk:', e); }
}
async function startWalking() {
  if (!navigator.geolocation) { toast('ბრაუზერს GPS არ აქვს'); return; }
  walking = true; lastSent = { at: 0, pos: null };
  $('walkBtn').textContent = 'დავამთავრე'; $('walkBtn').classList.add('stop');
  try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* არაა კრიტიკული */ }
  sendPos(me);
  watchId = navigator.geolocation.watchPosition(
    pos => { me = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy }; drawMe(); sendPos(me); },
    () => { toast('GPS ვერ მუშაობს. შეამოწმეთ ნებართვა'); stopWalking(); },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  drawMe();
}
async function stopWalking() {
  if (!walking) return;
  walking = false;
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  try { if (wakeLock) await wakeLock.release(); } catch (e) { /* არაა კრიტიკული */ }
  wakeLock = null;
  $('walkBtn').textContent = 'ვსეირნობ'; $('walkBtn').classList.remove('stop');
  try { await A.stopWalk(dog.id); } catch (e) { console.warn(e); }
  drawMe();
}
$('walkBtn').onclick = () => walking ? stopWalking() : startWalking();
$('locate').onclick = async () => {
  toast('ვეძებ ლოკაციას...');
  const p = await getPos();
  if (!p) return toast('ლოკაცია ვერ მივიღე. ჩართეთ GPS და მიეცით ნებართვა საიტს');
  me = p; map.setView([me.lat, me.lng], 17); drawMe(); loadNearby();
  toast('სიზუსტე ~' + Math.round(p.acc) + ' მ');
};
$('sos').onclick = () => toast('SOS ფუნქცია მალე დაემატება');
window.addEventListener('pagehide', () => { if (walking && !DEMO) A.stopWalk(dog.id); });

/* ---------- მარშრუტიზაცია ---------- */
async function route() {
  try {
    user = await A.user();
    clearInterval(pollTimer); mapStarted = false;
    if (!user) { dog = null; $('password').value = ''; return show('login'); }
    dog = await A.getDog(user.id);
    if (!dog) return show('dog');
    $('dogTitle').textContent = '🐾 ' + dog.name;
    show('mapView'); await startMap();
  } catch (e) { toast('შეცდომა: ' + (e.message || e)); show('login'); }
}
if (DEMO) $('demoBanner').classList.remove('hidden');
A.onAuth(route);
route();
</script>
